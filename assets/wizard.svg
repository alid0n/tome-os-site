<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240" role="img" aria-label="The Tome setup wizard: a green crystal ball wearing a blue wizard hat">
<title>Tome setup wizard</title>
<defs>
  <radialGradient id="wz-glass" cx="0.38" cy="0.34" r="0.75">
    <stop offset="0" stop-color="#c9ffe0"/>
    <stop offset="0.28" stop-color="#5ff0a0"/>
    <stop offset="0.7" stop-color="#16a862"/>
    <stop offset="1" stop-color="#0a5a35"/>
  </radialGradient>
  <radialGradient id="wz-aura" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#5ff0a0" stop-opacity="0.45"/>
    <stop offset="1" stop-color="#5ff0a0" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="wz-hat" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#4f8dff"/>
    <stop offset="1" stop-color="#1f45c9"/>
  </linearGradient>
  <linearGradient id="wz-robe" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#3366ee"/>
    <stop offset="1" stop-color="#1a37a6"/>
  </linearGradient>
</defs>

<!-- Robe, with the crystal ball's pedestal as its collar -->
<path class="wz-robe" d="M62 238 C60 210 70 186 86 176 H114 C130 186 140 210 138 238 Z" fill="url(#wz-robe)"/>
<path d="M100 178 V238" stroke="#9cc0ff" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
<g fill="#f2b84b"><circle cx="82" cy="214" r="2.6"/><circle cx="120" cy="204" r="2.2"/><circle cx="116" cy="228" r="2.4"/></g>
<path d="M84 170 H116 L120 180 H80 Z" fill="#9d7bff"/>
<rect x="74" y="178" width="52" height="7" rx="3.5" fill="#c8b4ff"/>

<!-- Wand -->
<g class="wz-wand">
  <path d="M136 196 L162 150" stroke="#6b4a2b" stroke-width="5" stroke-linecap="round"/>
  <path d="M162 150 l3.2 -9 l3.2 9 l9 3.2 l-9 3.2 l-3.2 9 l-3.2 -9 l-9 -3.2 z" fill="#f2b84b" transform="translate(-3 -3)"/>
  <circle cx="134" cy="198" r="7" fill="#c9ffe0" stroke="#0a5a35" stroke-width="2"/>
</g>

<!-- The crystal ball head -->
<g class="wz-head">
  <circle cx="100" cy="128" r="58" fill="url(#wz-aura)"/>
  <circle cx="100" cy="128" r="42" fill="url(#wz-glass)" stroke="#0a5a35" stroke-width="3"/>
  <path d="M74 112 a30 30 0 0 1 22 -16" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.85"/>
  <circle cx="72" cy="124" r="2.6" fill="#ffffff" opacity="0.8"/>
  <!-- face -->
  <g class="wz-eyes" fill="#08331f">
    <ellipse cx="87" cy="130" rx="5" ry="6.5"/>
    <ellipse cx="113" cy="130" rx="5" ry="6.5"/>
  </g>
  <g fill="#ffffff"><circle cx="89" cy="127.5" r="1.8"/><circle cx="115" cy="127.5" r="1.8"/></g>
  <path d="M90 145 q10 8 20 0" fill="none" stroke="#08331f" stroke-width="3.2" stroke-linecap="round"/>
  <g fill="#ff6f9f" opacity="0.6"><ellipse cx="78" cy="142" rx="5" ry="3"/><ellipse cx="122" cy="142" rx="5" ry="3"/></g>
</g>

<!-- The wizard hat -->
<g class="wz-hat">
  <path d="M62 98 C70 70 82 40 104 18 C112 10 124 6 134 10 C142 14 144 24 136 28 C130 31 124 26 128 21 C120 22 114 30 110 40 C118 60 128 80 138 98 Z" fill="url(#wz-hat)"/>
  <path d="M68 92 C92 86 112 86 134 92 L136 99 C112 93 90 93 66 99 Z" fill="#f2b84b"/>
  <ellipse cx="100" cy="100" rx="64" ry="12" fill="#1f45c9"/>
  <ellipse cx="100" cy="97" rx="64" ry="10" fill="url(#wz-hat)"/>
  <g fill="#f2b84b">
    <path d="M96 58 l2.4 -6.4 l2.4 6.4 l6.4 2.4 l-6.4 2.4 l-2.4 6.4 l-2.4 -6.4 l-6.4 -2.4 z"/>
    <circle cx="116" cy="74" r="2.6"/>
    <path d="M84 78 a6 6 0 1 0 6 -8 a4.6 4.6 0 1 1 -6 8 z"/>
  </g>
</g>
</svg>
