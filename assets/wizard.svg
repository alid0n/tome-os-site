<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240" role="img" aria-label="The Tome setup wizard: a green crystal ball wearing a blue wizard hat">
<title>Tome setup wizard</title>
<!-- Drawn like the Tome OS mark: flat fills, a light outline, the crystal ball as a glowing ring
     with a glint and a spark, and the mark's violet pedestal under it. -->

<!-- Robe -->
<path d="M66 232 C64 206 74 188 88 180 H112 C126 188 136 206 134 232 Z" fill="#22328c" stroke="#efeaff" stroke-width="4.5" stroke-linejoin="round"/>
<path d="M100 186 V230" stroke="#efeaff" stroke-width="3" stroke-linecap="round" opacity="0.45"/>
<g fill="#f2b84b"><circle cx="82" cy="214" r="2.6"/><circle cx="119" cy="205" r="2.2"/></g>

<!-- The pedestal, as in the Tome OS mark -->
<path d="M88 172 H112 L117 179 H83 Z" fill="#9d7bff"/>
<rect x="76" y="178" width="48" height="7" rx="3.5" fill="#c8b4ff"/>

<!-- Wand -->
<path d="M132 204 L158 160" stroke="#efeaff" stroke-width="4.5" stroke-linecap="round"/>
<path d="M159 147 l3.4 8.6 l8.6 3.4 l-8.6 3.4 l-3.4 8.6 l-3.4 -8.6 l-8.6 -3.4 l8.6 -3.4 z" fill="#f2b84b"/>

<!-- The crystal ball head: a glow, the ring, its glint and spark, and a face -->
<circle cx="100" cy="130" r="52" fill="#5ff0a0" opacity="0.12"/>
<circle cx="100" cy="130" r="40" fill="#123a2c" stroke="#5ff0a0" stroke-width="5.5"/>
<path d="M77 120 a26 26 0 0 1 20 -14" fill="none" stroke="#efeaff" stroke-width="4.5" stroke-linecap="round"/>
<circle cx="124" cy="147" r="3.6" fill="#efeaff"/>
<g fill="#efeaff"><rect x="85" y="125" width="6" height="11" rx="3"/><rect x="109" y="125" width="6" height="11" rx="3"/></g>
<path d="M91 145 q9 7 18 0" fill="none" stroke="#efeaff" stroke-width="3.6" stroke-linecap="round"/>

<!-- The wizard hat -->
<path d="M66 98 C74 72 86 44 106 20 C113 12 124 8 133 12 C141 16 142 26 134 29 C128 31 123 26 127 21 C119 23 114 31 111 40 C119 60 128 80 134 98 Z" fill="#2f5fe0" stroke="#efeaff" stroke-width="4.5" stroke-linejoin="round"/>
<rect x="38" y="94" width="124" height="14" rx="7" fill="#2f5fe0" stroke="#efeaff" stroke-width="4.5"/>
<path d="M71 88 H129" stroke="#f2b84b" stroke-width="5" stroke-linecap="round"/>
<path d="M98 54 l2.6 6.4 l6.4 2.6 l-6.4 2.6 l-2.6 6.4 l-2.6 -6.4 l-6.4 -2.6 l6.4 -2.6 z" fill="#efeaff"/>
<circle cx="113" cy="74" r="2.6" fill="#f2b84b"/>
</svg>
