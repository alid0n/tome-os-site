@keyframes halo{0%,66%{opacity:0;transform:scale(.6)}74%{opacity:.4;transform:scale(1.3)}80%,92%{opacity:.14;transform:scale(1)}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
