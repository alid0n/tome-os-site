<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 200" width="440" height="400" role="img" aria-label="Sparks gather into the crystal ball, the book is drawn in light beneath it, and its pages riffle before the ball settles onto its pedestal and glows">
