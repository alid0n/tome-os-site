<svg xmlns="http://www.w3.org/2000/svg" viewBox="26 25 56 64" width="336" height="384" role="img" aria-label="Sending: waves leave the crystal ball and travel upward, fading as they go">
<title>Telemancer sending</title>
<style>
.w1,.w2,.w3{animation:send 1.2s ease-out infinite;opacity:0}
.w2{animation-delay:.15s}.w3{animation-delay:.3s}
@keyframes send{0%{opacity:0;transform:translateY(4px)}25%{opacity:1}100%{opacity:0;transform:translateY(-6px)}}
.ball{animation:bob 1.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:none}20%{transform:translateY(1px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<g class="ball"><circle class="halo" cx="54" cy="64" r="20" fill="#3a2d78"/><circle cx="54" cy="64" r="14" fill="#43357f" stroke="#9d7bff" stroke-width="4"/><path d="M45.8 60.4a9 9 0 0 1 7-5.4" fill="none" stroke="#efeaff" stroke-width="2.6" stroke-linecap="round"/><circle cx="59.5" cy="68" r="2.2" fill="#efeaff"/></g><path d="M47 79h14l2.5 4h-19z" fill="#9d7bff"/><rect x="40" y="83" width="28" height="3.6" rx="1.8" fill="#c8b4ff"/>
<g fill="none" stroke="#5cc8ff" stroke-width="3.4" stroke-linecap="round"><path class="w1" d="M38.4 50.4a22 22 0 0 1 31.2 0" opacity="1"/><path class="w2" d="M34.2 46.2a28 28 0 0 1 39.6 0" opacity="1"/><path class="w3" d="M30 42a34 34 0 0 1 48 0" opacity="1"/></g>
</svg>
